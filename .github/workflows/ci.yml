name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @fileway/core --filter @fileway/local --filter @fileway/s3 --filter @fileway/cloudinary run build

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # MinIO stopped publishing community images (quay.io now returns 401 and the
      # Docker Hub images are gone), so use Chainguard's build of the same server.
      # It runs as a non-root user (UID 65532), hence the writable tmpfs for /data.
      - name: Start MinIO
        env:
          MINIO_IMAGE: cgr.dev/chainguard/minio:latest
        run: |
          for attempt in 1 2 3; do
            docker pull "$MINIO_IMAGE" && break
            if [ "$attempt" -eq 3 ]; then echo "Failed to pull $MINIO_IMAGE" >&2; exit 1; fi
            sleep 5
          done
          docker run -d --name minio \
            -p 9000:9000 \
            --tmpfs /data:rw,mode=1777 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:9000/minio/health/live >/dev/null; then
            echo "MinIO failed to start" >&2
            docker logs minio >&2 || true
            exit 1
          fi

      - name: S3 integration tests (MinIO)
        run: pnpm --filter @fileway/s3 exec vitest run src/minio.integration.test.ts
        env:
          RUN_MINIO_TESTS: "1"
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: fileway-ci
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin

      - name: Docs typecheck
        run: pnpm --filter @fileway/docs run types:check
