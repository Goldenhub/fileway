name: Publish to npm

# Triggered by git tags (e.g. `v0.0.4`). All four packages must be at the
# version named by the tag. Uses npm Trusted Publishers (OIDC) — no stored
# NPM tokens — and publishes with cryptographic build provenance.
#
# npm setup (one-time, per package):
#   npmjs.com -> package -> Settings -> "Publish to GitHub Actions":
#     GitHub repository: Goldenhub/fileway
#     Workflow:          release.yml

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify package versions match tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for p in core driver-local driver-s3 driver-cloudinary; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$VERSION" ]; then
              echo "::error::packages/$p is at $v but the tag is $VERSION"
              exit 1
            fi
          done

      - name: Build packages
        timeout-minutes: 10
        run: pnpm --filter "@fileway/core" --filter "@fileway/driver-*" run build

      - name: Publish to npm (provenance)
        run: pnpm -r publish --access public --provenance --no-git-checks
