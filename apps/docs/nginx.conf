# Serves the static export (`out/`) of the docs site. Pages are exported as
# `<path>.html`, so clean URLs like /docs/getting-started/quickstart resolve.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/atom+xml image/svg+xml;

  # Next's hashed build files never change: cache them for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location / {
    # Remove a trailing slash (except the root), so each page has one URL.
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
